name: ${COMPOSE_PROJECT_NAME:-citysafe}

x-gateway-image: &gateway-image
  image: ${CITYSAFE_GATEWAY_IMAGE:-citysafe-gateway}:${CITYSAFE_IMAGE_TAG:-local}
  build:
    context: ../123123
    dockerfile: Dockerfile
    additional_contexts:
      citysafe_db: ./db

x-pg-environment: &pg-environment
  PGHOST: db
  PGPORT: "5432"
  PGDATABASE: ${POSTGRES_DB:-citysafe}
  PGUSER: ${POSTGRES_USER:-citysafe}
  PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16.4-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-citysafe}
      POSTGRES_USER: ${POSTGRES_USER:-citysafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    volumes:
      - citysafe_db_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    shm_size: 256m
    stop_grace_period: 60s
    logging: *default-logging

  migrate:
    <<: *gateway-image
    restart: "no"
    command:
      - python
      - /opt/citysafe/deploy/db/migrate.py
    environment:
      <<: *pg-environment
      CITYSAFE_ENV: ${CITYSAFE_ENV:-development}
      MIGRATIONS_DIR: /opt/citysafe/deploy/db/migrations
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    restart: unless-stopped
    command:
      - server
      - /data
      - --console-address
      - :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - citysafe_minio_data:/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:9000/minio/health/ready
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    stop_grace_period: 60s
    logging: *default-logging

  minio-init:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    restart: "no"
    entrypoint:
      - /bin/sh
      - -ceu
    command:
      - |
        bucket="$${MINIO_BUCKET}"
        case "$${bucket}" in
          ''|*[!a-z0-9.-]*|.*|*.) echo "invalid MINIO_BUCKET" >&2; exit 1 ;;
        esac
        if [ "$${#bucket}" -lt 3 ] || [ "$${#bucket}" -gt 63 ]; then
          echo "invalid MINIO_BUCKET length" >&2
          exit 1
        fi
        if [ "$${MINIO_ROOT_USER}" = "$${MINIO_ACCESS_KEY}" ]; then
          echo "MinIO root and application users must be different" >&2
          exit 1
        fi
        mc alias set citysafe http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "citysafe/$${bucket}"
        printf '%s\n' \
          '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket","s3:ListBucketMultipartUploads"],"Resource":["arn:aws:s3:::'"$${bucket}"'"]},{"Effect":"Allow","Action":["s3:AbortMultipartUpload","s3:DeleteObject","s3:GetObject","s3:ListMultipartUploadParts","s3:PutObject"],"Resource":["arn:aws:s3:::'"$${bucket}"'/*"]}]}' \
          > /tmp/citysafe-app-policy.json
        # Idempotent for re-init and backup-restore cutovers.
        mc admin policy create citysafe citysafe-app /tmp/citysafe-app-policy.json 2>/dev/null \
          || mc admin policy put citysafe citysafe-app /tmp/citysafe-app-policy.json 2>/dev/null \
          || true
        if mc admin user info citysafe "$${MINIO_ACCESS_KEY}" >/dev/null 2>&1; then
          mc admin user remove citysafe "$${MINIO_ACCESS_KEY}"
        fi
        mc admin user add citysafe "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}"
        mc admin policy attach citysafe citysafe-app --user "$${MINIO_ACCESS_KEY}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-team-shared}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - backend
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  gateway:
    <<: *gateway-image
    restart: unless-stopped
    environment:
      <<: *pg-environment
      BIND_HOST: 0.0.0.0
      CITYSAFE_NO_BROWSER: "1"
      CITYSAFE_SKIP_BUILD: "1"
      CITYSAFE_ENV: ${CITYSAFE_ENV:-development}
      CITYSAFE_DATA_DIR: /data
      DATA_BACKEND: postgres
      AUTH_REQUIRED: ${AUTH_REQUIRED:-1}
      AUTH_SIGNING_SECRET: ${AUTH_SIGNING_SECRET:?AUTH_SIGNING_SECRET is required}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-28800}
      AUTH_LOGIN_MAX_ATTEMPTS: ${AUTH_LOGIN_MAX_ATTEMPTS:-5}
      AUTH_LOGIN_LOCK_SECONDS: ${AUTH_LOGIN_LOCK_SECONDS:-900}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:?BOOTSTRAP_ADMIN_USERNAME is required}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-系统管理员}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      ALLOW_INSECURE_LOCAL_WRITES: "0"
      MLOPS_TOKEN: ${MLOPS_TOKEN:?MLOPS_TOKEN is required}
      ANNOTATION_UPLOAD_TOKEN: ${ANNOTATION_UPLOAD_TOKEN:?ANNOTATION_UPLOAD_TOKEN is required}
      DATASET_UPLOAD_TOKEN: ${DATASET_UPLOAD_TOKEN:?DATASET_UPLOAD_TOKEN is required}
      SHARED_STORAGE_BACKEND: minio
      # 数据集/标注二进制同样收口 MinIO（可单独设回 local 灰度回退）
      DATASET_STORAGE_BACKEND: ${DATASET_STORAGE_BACKEND:-minio}
      ANNOTATION_STORAGE_BACKEND: ${ANNOTATION_STORAGE_BACKEND:-minio}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-team-shared}
      MINIO_SECURE: "false"
      MINIO_PUBLIC_UPLOAD_PREFIX: ${MINIO_PUBLIC_UPLOAD_PREFIX:-}
      MINIO_ALLOW_INSECURE_PRESIGN: ${MINIO_ALLOW_INSECURE_PRESIGN:-0}
      MINIO_PRESIGN_EXPIRE: ${MINIO_PRESIGN_EXPIRE:-600}
      MAX_JSON_BODY_BYTES: ${MAX_JSON_BODY_BYTES:-2097152}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-209715200}
      MAX_DATASET_BYTES: ${MAX_DATASET_BYTES:-53687091200}
      DATASET_CHUNK_SIZE: ${DATASET_CHUNK_SIZE:-8388608}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - citysafe_state:/data
      - citysafe_uploads:/data/uploads
      - citysafe_logs:/data/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    networks:
      - frontend
      - backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          data=json.load(urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=5));
          assert data.get("ok") is True and data.get("ready") is True and data.get("degraded") is not True
      interval: 10s
      timeout: 6s
      retries: 20
      start_period: 20s
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging: *default-logging

  edge:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - /opt/citysafe/edge-entrypoint.sh
    command:
      - nginx
      - -g
      - daemon off;
    environment:
      APP_ENV: ${APP_ENV:-local}
      SHOW_DEMO_ACCOUNTS: ${SHOW_DEMO_ACCOUNTS:-false}
      GATEWAY_AUTH_ENABLED: ${GATEWAY_AUTH_ENABLED:-true}
      API_PROXY: ${API_PROXY:-}
      ANNOTATION_STORAGE_BUCKET: ${ANNOTATION_STORAGE_BUCKET:-annotations}
      SERVER_NAME: ${SERVER_NAME:-localhost}
    volumes:
      - ./nginx/container/edge-entrypoint.sh:/opt/citysafe/edge-entrypoint.sh:ro
      - ./nginx/container/local.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/container/citysafe-locations.conf:/etc/nginx/citysafe-locations.conf:ro
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/healthz
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging: *default-logging

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  citysafe_db_data:
  citysafe_minio_data:
  citysafe_uploads:
  citysafe_logs:
  citysafe_state:
