location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Both legacy script names and the new explicit name resolve to the generated,
# public-only runtime file. This prevents a workstation config.local.js from
# ever being served by the containerized deployment.
location = /config.js {
    alias /usr/share/nginx/runtime/config.runtime.js;
    default_type application/javascript;
    expires epoch;
}

location = /config.local.js {
    alias /usr/share/nginx/runtime/config.runtime.js;
    default_type application/javascript;
    expires epoch;
}

location = /config.runtime.js {
    alias /usr/share/nginx/runtime/config.runtime.js;
    default_type application/javascript;
    expires epoch;
}

location = /favicon.ico {
    access_log off;
    return 204;
}

# Login receives a much tighter independent budget than the rest of the API.
location = /api/auth/login {
    limit_req zone=citysafe_login burst=3 nodelay;
    proxy_pass http://citysafe_gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
}

location /api/dataset/ {
    limit_req zone=citysafe_api burst=60 nodelay;
    proxy_pass http://citysafe_gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 30s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 256m;
}

location /api/shared-file/download {
    proxy_pass http://citysafe_gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 600s;
}

location /api/ {
    limit_req zone=citysafe_api burst=40 nodelay;
    proxy_pass http://citysafe_gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 30s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_max_body_size 220m;
}

# The gateway signs against the internal endpoint "minio:9000". Preserve that
# Host header while exposing only this signed object path through the edge.
location /minio-upload/ {
    limit_req zone=citysafe_presign burst=30 nodelay;
    proxy_pass http://minio:9000/;
    proxy_http_version 1.1;
    proxy_set_header Host minio:9000;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 30s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # Cap body size at the edge; gateway also rejects confirm when object > declared size.
    client_max_body_size 220m;
}

# Never let the gateway's static-file fallback expose implementation, state,
# local overrides, uploads, or logs.
location ~ /\.(?!well-known/) {
    return 404;
}

location ~* \.(?:py|pyc|pyo|env|sqlite|db|log|bak|example|md|sh|service|conf)$ {
    return 404;
}

location ~* /(?:Dockerfile|requirements\.txt|package(?:-lock)?\.json|server\.cjs|proxy_server\.js|worker\.js|build_assets\.py|start_web\.py)$ {
    return 404;
}

location ^~ /uploads/ {
    return 404;
}

location ^~ /logs/ {
    return 404;
}

location / {
    proxy_pass http://citysafe_gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
}
